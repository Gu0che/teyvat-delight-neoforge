modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Gu0che/teyvat-delight-neoforge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="提瓦特乐事"
authors="Gu0che"
displayURL="https://github.com/Gu0che/teyvat-delight-neoforge"
description='''
Farmer's Delight addon that adds Teyvat-inspired crops, ingredients, dishes and minerals,
an advancement tree built around collecting them, and the Katheryne commission & shop system.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="required"
    versionRange="[1.3.2,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[9.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="caelus"
    type="optional"
    versionRange="[7.0.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cloth_config"
    type="optional"
    versionRange="[15.0.140,)"
    ordering="AFTER"
    side="CLIENT"
